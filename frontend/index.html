<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Ticket Support</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid justify-content-start">
            <a class="navbar-brand" href ="#">AI Ticket Support</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="#">Tickets</a>
                <a class="nav-link" href="#">About</a>
            </div>
        </div>
    </nav>

    <main class="container mt-5">

            <section id="dashboard">
                <h1>Ticket Dashboard</h1>

                <p>Welcome to your AI-powered support system.</p>
            </section>

            <section id="tickets">
                <form id="ticketForm">
                    <textarea
                        id="ticketInput"
                        class="form-control"
                        rows="5"
                        placeholder="Enter your ticket query here..."
                        required
                    ></textarea>
                    <button type="submit" class="btn btn-primary mt-2">
                        Submit Query
                    </button>
                </form>
            </section>

            <section id="ticketSummaries">
                <h2 class="mt-4">Ticket Summaries</h2>

                <div id="ticketList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                </div>
            </section>
    
    <script src="script.js"></script>
</body>
